<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiskundebijles</title>
<link rel="icon" type="image/png" href="/Wiskunde-bijles/favicon.png?v=2">
<link rel="apple-touch-icon" href="/Wiskunde-bijles/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/Wiskunde-bijles/icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="/Wiskunde-bijles/icon-512.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wiskunde">
<meta name="theme-color" content="#1E3A8A">
<style>
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#f6f7fb; color:#1f2540;
         min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px; box-sizing:border-box; }
  img { width:120px; height:120px; border-radius:26px; box-shadow:0 6px 20px rgba(0,0,0,.15); }
  h1 { font-size:1.6rem; margin:20px 0 8px; }
  a.knop { display:inline-block; margin-top:18px; padding:14px 28px; background:#1E3A8A; color:#fff;
           border-radius:12px; text-decoration:none; font-weight:600; font-size:1.1rem; }
  .tip { margin-top:26px; color:#6b7191; font-size:.95rem; max-width:340px; line-height:1.4; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>📐 Wiskundebijles</h1>
  <a class="knop" href="https://wiskunde-bijles-dochter.streamlit.app">Openen</a>
  <p class="tip">Tip: tik op <b>Delen</b> &rarr; <b>Zet op beginscherm</b> om dit icoon op je telefoon of iPad te zetten.</p>
</main>
<script>
  // Gestart vanaf het beginscherm? Dan meteen door naar de app.
  if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
    location.replace("https://wiskunde-bijles-dochter.streamlit.app");
  }
</script>
</body>
</html>
