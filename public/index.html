<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiskundebijles</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1f2540; --muted:#6b7191; --accent:#4f6bed; --accent-soft:#e8ecff; --user:#4f6bed; --line:#e3e6f2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
  header button:hover { background: var(--accent-soft); }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 820px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 1.05rem; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot { background: var(--card); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: var(--user); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.err { background: #fff0f0; border-color: #f2c4c4; color: #8a1f1f; }
  .msg img { max-width: 220px; max-height: 180px; border-radius: 10px; display: block; margin-bottom: 8px; }
  .typing { color: var(--muted); font-style: italic; }
  footer { background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px; }
  .composer { max-width: 820px; margin: 0 auto; }
  #previews { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  #previews .pv { position: relative; }
  #previews img { height: 64px; border-radius: 8px; border: 1px solid var(--line); }
  #previews button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #555; color: #fff; cursor: pointer; line-height: 1; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 1.05rem; max-height: 140px; min-height: 48px; background: var(--bg); color: var(--ink); }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .btn { border: none; border-radius: 14px; height: 48px; padding: 0 16px; font-size: 1rem; cursor: pointer; }
  .btn.photo { background: var(--accent-soft); color: var(--accent); }
  .btn.send { background: var(--accent); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .hint { text-align:center; color: var(--muted); font-size: .8rem; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>📐 Wiskundebijles</h1>
  <button id="reset" title="Begin opnieuw">Nieuw gesprek</button>
</header>

<div id="chat"></div>

<footer>
  <div class="composer">
    <div id="previews"></div>
    <div class="row">
      <button class="btn photo" id="photoBtn" title="Foto van je oefening toevoegen">📷 Foto</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="Schrijf hier je vraag of je poging…"></textarea>
      <button class="btn send" id="send">Verstuur</button>
    </div>
    <div class="hint">Je bijlesleraar helpt je denken, maar het werk doe jij zelf. 💪</div>
  </div>
</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const fileInput = document.getElementById('file');
const previews = document.getElementById('previews');
let history = [];      // berichten voor de API
let pending = [];      // foto's die nog niet verstuurd zijn (dataURL)
let busy = false;

function addMsg(text, cls, images) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  (images || []).forEach(src => { const i = document.createElement('img'); i.src = src; d.appendChild(i); });
  const t = document.createElement('span');
  t.textContent = text;
  d.appendChild(t);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function renderPreviews() {
  previews.innerHTML = '';
  pending.forEach((src, i) => {
    const w = document.createElement('div'); w.className = 'pv';
    const img = document.createElement('img'); img.src = src;
    const x = document.createElement('button'); x.textContent = '×';
    x.onclick = () => { pending.splice(i, 1); renderPreviews(); };
    w.append(img, x); previews.appendChild(w);
  });
}

// Foto verkleinen zodat het versturen snel blijft
function shrink(file, max = 1400) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

document.getElementById('photoBtn').onclick = () => fileInput.click();
fileInput.onchange = async () => {
  for (const f of fileInput.files) {
    if (pending.length >= 4) break;
    try { pending.push(await shrink(f)); } catch (_) {}
  }
  fileInput.value = '';
  renderPreviews();
};

input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.onclick = send;

async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text && !pending.length) return;
  busy = true; sendBtn.disabled = true;

  const imgs = pending.slice();
  const content = imgs.map(src => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: src.split(',')[1] } }));
  content.push({ type: 'text', text: text || '(Zie foto)' });
  history.push({ role: 'user', content });

  addMsg(text, 'me', imgs);
  input.value = ''; input.style.height = 'auto';
  pending = []; renderPreviews();
  const typing = addMsg('Even nadenken…', 'bot typing');

  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    const data = await r.json();
    typing.remove();
    if (!r.ok) { history.pop(); addMsg(data.error || 'Er ging iets mis.', 'bot err'); }
    else { history.push({ role: 'assistant', content: data.text }); addMsg(data.text, 'bot'); }
  } catch (e) {
    typing.remove(); history.pop();
    addMsg('Ik kan de bijlesleraar niet bereiken. Is de server nog gestart?', 'bot err');
  }
  busy = false; sendBtn.disabled = false; input.focus();
}

async function start() {
  history = []; chat.innerHTML = ''; pending = []; renderPreviews();
  // Eerste begroeting komt van de bijlesleraar zelf
  history.push({ role: 'user', content: [{ type: 'text', text: '(Een nieuwe sessie begint. Begroet me kort en vraag waaraan ik wil werken.)' }] });
  busy = true; sendBtn.disabled = true;
  const typing = addMsg('Even nadenken…', 'bot typing');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: history }) });
    const data = await r.json();
    typing.remove();
    if (!r.ok) { history = []; addMsg(data.error || 'Er ging iets mis.', 'bot err'); }
    else { history.push({ role: 'assistant', content: data.text }); addMsg(data.text, 'bot'); }
  } catch (e) {
    typing.remove(); history = [];
    addMsg('Ik kan de bijlesleraar niet bereiken. Is de server nog gestart?', 'bot err');
  }
  busy = false; sendBtn.disabled = false;
}
document.getElementById('reset').onclick = () => { if (!history.length || confirm('Een nieuw gesprek beginnen?')) start(); };
start();
</script>
</body>
</html>
